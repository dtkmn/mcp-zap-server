name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: ["main", "dev"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Run CI helper tests
        run: python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Build with Gradle
        run: ./gradlew build --scan --no-daemon --stacktrace --info

      - name: Run Docker-backed integration tests
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: ./gradlew dockerTest --scan --no-daemon --stacktrace --info

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/test-results/test/**
            build/test-results/dockerTest/**
            build/reports/tests/test/**
            build/reports/tests/dockerTest/**
            build/reports/problems/problems-report.html

  container-build:
    name: Build main container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Distroless runtime signature
        run: ./scripts/verify-distroless-signature.sh

      - name: Build main container
        run: docker build --platform linux/amd64 --tag mcp-zap-server:main-verify .
