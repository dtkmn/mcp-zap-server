name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: ["main", "dev"]
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle
          server-id: github
          settings-path: ${{ github.workspace }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Node 22 for Claude Desktop tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packaging/claude-desktop/package-lock.json

      - name: Install Claude Desktop test dependencies
        working-directory: packaging/claude-desktop
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Test Claude Desktop connector without building distribution assets
        working-directory: packaging/claude-desktop
        run: npm test

      - name: Run CI helper tests
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Build with Gradle
        run: ./gradlew build --scan --no-daemon --stacktrace --info

      - name: Run Docker-backed integration tests
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main')
        run: ./gradlew dockerTest --scan --no-daemon --stacktrace --info

      - name: Generate Java coverage report
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Analyze coverage in SonarQube Cloud
        if: >-
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::notice::Sonar analysis skipped: configure the SONAR_TOKEN repository secret and CI analysis mode. The coverage report is available in test-reports."
            exit 0
          fi
          ./gradlew sonar --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/test-results/test/**
            build/test-results/dockerTest/**
            build/reports/tests/test/**
            build/reports/tests/dockerTest/**
            build/reports/jacoco/test/**
            build/reports/problems/problems-report.html

  container-build:
    name: Build main container
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Distroless runtime signature
        run: ./scripts/verify-distroless-signature.sh

      - name: Build main container
        run: docker build --platform linux/amd64 --tag mcp-zap-server:main-verify .
