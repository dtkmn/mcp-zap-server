name: Snyk Security

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["main"]
  schedule:
    - cron: "43 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

env:
  SNYK_SEVERITY_THRESHOLD: high
  SNYK_ORG: ${{ vars.SNYK_ORG }}

jobs:
  open-source:
    name: Open source dependencies
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: "25"
          distribution: temurin
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master

      - name: Require Snyk configuration
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "::error::SNYK_TOKEN repository secret is required for Snyk scans."
            exit 1
          fi
          if [ -z "${SNYK_ORG:-}" ]; then
            echo "::error::SNYK_ORG repository variable is required for Snyk scans."
            exit 1
          fi

      - name: Stage local extension API for dependency analysis
        run: ./gradlew publishExtensionApiPublicPreviewPublicationToExtensionApiPublicPreviewStagingRepository --no-scan --no-daemon

      - name: Run Snyk Open Source test and verify dependency coverage
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          python3 scripts/ci/snyk_report.py source

      - name: Upload Snyk Open Source SARIF
        if: always() && hashFiles('build/snyk-reports/source/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: build/snyk-reports/source/report.sarif
          category: snyk-open-source

      - name: Upload Snyk Open Source diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snyk-source-diagnostics
          path: build/snyk-reports/source/
          retention-days: 7
          if-no-files-found: ignore

      - name: Monitor open-source dependencies
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          python3 scripts/ci/snyk_report.py monitor-source

  container:
    name: Container image
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    env:
      IMAGE_REF: mcp-zap-server:snyk-scan
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master

      - name: Require Snyk configuration
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "::error::SNYK_TOKEN repository secret is required for Snyk scans."
            exit 1
          fi
          if [ -z "${SNYK_ORG:-}" ]; then
            echo "::error::SNYK_ORG repository variable is required for Snyk scans."
            exit 1
          fi

      - name: Build image for container scan
        run: docker build --pull -t "${IMAGE_REF}" .

      - name: Run Snyk Container test and verify runtime coverage
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          python3 scripts/ci/snyk_report.py container --image "${IMAGE_REF}"

      - name: Upload Snyk Container SARIF
        if: always() && hashFiles('build/snyk-reports/container/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: build/snyk-reports/container/report.sarif
          category: snyk-container

      - name: Upload Snyk Container diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snyk-container-diagnostics
          path: build/snyk-reports/container/
          retention-days: 7
          if-no-files-found: ignore

      - name: Monitor container image
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk container monitor "${IMAGE_REF}" \
            --file=Dockerfile \
            --app-vulns \
            --org="${SNYK_ORG}"

  infrastructure-as-code:
    name: Rendered Helm manifests
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@11b673cfb4b0dc0d860a1323caa199d54950dcce # master

      - name: Require Snyk configuration
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "${SNYK_TOKEN:-}" ]; then
            echo "::error::SNYK_TOKEN repository secret is required for Snyk scans."
            exit 1
          fi
          if [ -z "${SNYK_ORG:-}" ]; then
            echo "::error::SNYK_ORG repository variable is required for Snyk scans."
            exit 1
          fi

      - name: Render Helm chart
        run: |
          helm template mcp-zap-server helm/mcp-zap-server \
            --values helm/mcp-zap-server/values-ci.yaml \
            --output-dir snyk-rendered-helm

      - name: Run Snyk IaC test and verify execution
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          python3 scripts/ci/snyk_report.py iac

      - name: Upload Snyk IaC SARIF
        if: always() && hashFiles('build/snyk-reports/iac/report.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: build/snyk-reports/iac/report.sarif
          category: snyk-iac

      - name: Upload Snyk IaC diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: snyk-iac-diagnostics
          path: build/snyk-reports/iac/
          retention-days: 7
          if-no-files-found: ignore
