{{- if .Values.migrations.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcp-zap-server.fullname" . }}-db-migrations
  labels:
    {{- include "mcp-zap-server.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    # Retain the SQL until the Job finishes; hook-succeeded would delete this
    # ConfigMap immediately after Helm creates it, before the Job can mount it.
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- (.Files.Glob "files/db/migration/*.sql").AsConfig | nindent 2 }}
{{- end }}
