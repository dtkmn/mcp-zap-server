{{- if and .Values.zap.enabled .Values.zap.persistence.enabled (not .Values.zap.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcp-zap-server.fullname" . }}-zap-pvc
  {{- if .Values.zap.persistence.retainOnDelete }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "mcp-zap-server.zap.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.zap.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.zap.persistence.size }}
  {{- if .Values.zap.persistence.storageClass }}
  storageClassName: {{ .Values.zap.persistence.storageClass }}
  {{- end }}
{{- end }}
