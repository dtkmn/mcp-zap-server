# AWS/EKS private single-replica baseline. Use an encrypted tunnel or TLS ingress.
# For multiple MCP replicas, start from values-ha.yaml instead.
# Copy this file and replace placeholders before production use.
# Set a working EBS CSI RWO StorageClass below, and verify CNI NetworkPolicy
# enforcement. Target/add-on/background HTTP egress remains opt-in; see README.
# Review the VPC CNI's standard/strict startup behavior and system-pod policies.
# Kubernetes NetworkPolicy does not isolate pods from their hosting node;
# verify node-service protection separately. See README's EKS/network guidance.
# OpenAPI content import also needs the README's sibling-storage/Recreate block
# and MCP v0.15.0 or later.

global:
  environment: prod

zap:
  service:
    type: ClusterIP
  config:
    existingSecret:
      name: mcp-zap-runtime
      apiKeyKey: ZAP_API_KEY
  persistence:
    enabled: true
    size: 20Gi
    # storageClass: your-ebs-rwo-storage-class

mcp:
  replicaCount: 1
  service:
    type: ClusterIP
  streamableHttp:
    sessionAffinity:
      enabled: false
      provider: ""
  security:
    mode: jwt
    enabled: true
    allowPlaceholderApiKey: false
    existingSecret:
      name: mcp-zap-runtime
      apiKeyKey: MCP_API_KEY
      jwtSecretKey: JWT_SECRET
    jwt:
      enabled: true
  zapClient:
    existingSecret:
      name: mcp-zap-runtime
      apiKeyKey: ZAP_API_KEY
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 1

migrations:
  enabled: false

networkPolicy:
  zap:
    enabled: true
  mcp:
    enabled: true
    allowSameNamespace: true
    extraIngress:
      - ipBlock:
          cidr: 10.0.0.0/16
          # Replace with your permitted private client source CIDR range.
